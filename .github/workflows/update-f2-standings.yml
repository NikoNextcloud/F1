name: Update F2 standings

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-f2-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install pandas lxml requests
      - name: Refresh FIA standings
        run: python scripts/update_f2_standings.py f2-data.js
      - name: Commit updated standings
        run: |
          if git diff --quiet -- f2-data.js; then
            echo "F2 standings are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add f2-data.js
          git commit -m "Update F2 standings from FIA"
          git push
