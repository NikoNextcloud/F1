name: Update F2 standings

on:
  push:
    branches: [main]
    paths:
      - scripts/update_f2_standings.py
      - .github/workflows/update-f2-standings.yml
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh-f2-standings:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install pandas lxml requests
      - name: Refresh FIA standings
        run: python scripts/update_f2_standings.py f2-data.js
      - name: Commit updated standings
        run: |
          if git diff --quiet -- f2-data.js; then
            echo "F2 standings are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add f2-data.js
          git commit -m "Update F2 standings from FIA"
          git push
      - name: Upload updated website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish updated website
        uses: actions/deploy-pages@v4
